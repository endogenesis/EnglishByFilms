name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build EnglishByFilms
    runs-on: macos-26
    timeout-minutes: 30

    env:
      PROJECT: EnglishByFilms.xcodeproj
      SCHEME: EnglishByFilms
      DESTINATION: platform=iOS Simulator,OS=26.5,name=iPhone 17

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare CI secrets file
        run: cp EnglishByFilms/Configuration/Secrets.example.json EnglishByFilms/Configuration/Secrets.json

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
